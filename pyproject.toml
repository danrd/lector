[project]
name = "llm-kit"
version = "0.1.0"
description = "Reusable LLM pipeline toolkit: Jinja2 prompt composition, backend-agnostic inference (local llama.cpp/vLLM or hosted via OpenRouter), and a resumable task-processing loop with wandb logging."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "jinja2",
    "pandas",
]

[project.optional-dependencies]
llama-cpp = [
    "llama-cpp-python[server]",
]
vllm = [
    "vllm>=0.6",
]
openrouter = [
    "openai",
]
hf = [
    "transformers",
    "torch",
]
logging = [
    "wandb",
]
test = [
    "pytest",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Same rationale as arc-agi's ruff config this was extracted from: pyflakes
# (undefined names, unused imports/variables) plus a few pycodestyle checks
# for actual mistakes, not style opinions.
select = ["E4", "E7", "E9", "F", "W"]
