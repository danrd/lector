[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lector"
version = "0.1.0"
description = "Personal lecture generator: topic -> Obsidian-grounded content -> narrated audio. Built on the llm_kit toolkit (toolkit/llm_kit/README.md)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "jinja2",
    "pandas",
    "pyyaml",
    "toolkit[llm-kit] @ git+https://github.com/danrd/toolkit.git",
]

[project.optional-dependencies]
llama-cpp = [
    "toolkit[llm-kit-llama-cpp] @ git+https://github.com/danrd/toolkit.git",
]
vllm = [
    "toolkit[llm-kit-vllm] @ git+https://github.com/danrd/toolkit.git",
]
openrouter = [
    "toolkit[llm-kit-openrouter] @ git+https://github.com/danrd/toolkit.git",
]
hf = [
    "toolkit[llm-kit-hf] @ git+https://github.com/danrd/toolkit.git",
]
tts-local = [
    "piper-tts",
]
tts-cloud = [
    "openai",
]
tts-orpheus = [
    "llama-cpp-python[server]",
    "snac",
    "torch",
]
logging = [
    "toolkit[llm-kit-logging] @ git+https://github.com/danrd/toolkit.git",
]
test = [
    "pytest",
    "lector[llama-cpp]",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["lector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Same rationale as arc-agi's ruff config this was extracted from: pyflakes
# (undefined names, unused imports/variables) plus a few pycodestyle checks
# for actual mistakes, not style opinions.
select = ["E4", "E7", "E9", "F", "W"]
