[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lector"
version = "0.1.0"
description = "Personal lecture generator: topic -> Obsidian-grounded content -> narrated audio. Built on the vendored llm_kit toolkit (llm_kit/README.md)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "jinja2",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
llama-cpp = [
    "llama-cpp-python[server]",
    # Resolves LlmConfig.model (a GGUF repo id) + quant_file into a real
    # local file for llama.cpp to load - see resolve_local_model_path().
    "huggingface_hub",
]
vllm = [
    "vllm>=0.6",
]
openrouter = [
    "openai",
]
hf = [
    "transformers",
    "torch",
    # Many HF tokenizers (Llama/Qwen family included) are SentencePiece-based;
    # AutoTokenizer.from_pretrained() needs this installed to convert them.
    "sentencepiece",
]
tts-local = [
    "piper-tts",
]
tts-cloud = [
    "openai",
]
tts-orpheus = [
    "llama-cpp-python[server]",
    "snac",
    "torch",
]
logging = [
    "wandb",
]
test = [
    "pytest",
    "lector[llama-cpp]",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_kit", "lector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Same rationale as arc-agi's ruff config this was extracted from: pyflakes
# (undefined names, unused imports/variables) plus a few pycodestyle checks
# for actual mistakes, not style opinions.
select = ["E4", "E7", "E9", "F", "W"]
